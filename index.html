<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Website Coming Soon.">
  <title>Nyro</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/KvZJMqM4/nyro-transparent.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/KvZJMqM4/nyro-transparent.png">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #02040b;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(0, 4, 14, 0.2), rgba(0, 4, 14, 0.38)),
        url("https://i.postimg.cc/4x2LZ6nK/Nyro-Background.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    main::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, transparent 0%, rgba(0, 7, 20, 0.16) 50%, rgba(0, 4, 13, 0.52) 100%);
      content: "";
      pointer-events: none;
    }

    h1 {
      margin: 0;
      padding: 1.5rem;
      color: #ffffff;
      font-size: clamp(2.6rem, 8vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1;
      text-align: center;
      text-indent: 0.16em;
      transform: translateY(180px);
      text-shadow:
        0 0 4px #ffffff,
        0 0 10px #bdeeff,
        0 0 22px #5fcfff,
        0 0 44px #1da9ff,
        0 0 78px rgba(0, 153, 255, 0.9);
      animation: glow 3.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        filter: brightness(0.92);
        text-shadow:
          0 0 3px #ffffff,
          0 0 8px #bdeeff,
          0 0 18px #5fcfff,
          0 0 36px #1da9ff,
          0 0 64px rgba(0, 153, 255, 0.75);
      }

      to {
        filter: brightness(1.12);
        text-shadow:
          0 0 5px #ffffff,
          0 0 13px #d7f7ff,
          0 0 28px #75dcff,
          0 0 54px #26b7ff,
          0 0 92px rgba(0, 153, 255, 1);
      }
    }

    @media (max-width: 520px) {
      h1 {
        padding: 1rem;
        font-size: clamp(2rem, 11vw, 3.4rem);
        letter-spacing: 0.1em;
        text-indent: 0.1em;
        transform: translateY(120px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
  </main>
</body>
</html>
